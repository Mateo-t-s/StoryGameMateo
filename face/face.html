<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            height: 400px;
            width: 300px;
            background-color:yellow;
            position: relative;
        }
        
        .eye {
            height: 100px;
            width: 100px;
            background-color: white;
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .pupil {
            height: 50px;
            width: 50px;
            background-color: black;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        
        .mouth {
            height: 200px;
            width: 250px;
            background-color: black;
            position: absolute;
            top: 160px;
            left: 30px;
        }

        .teeth_row {
            display: flex;
            gap: 10px;
            position: relative;
            top: 20px;
            left: 10px;
        }
        
        .teeth {
            height: 25px;
            width: 25px;
            background-color: white;
            position: relative;
            gap: 10px;
            top: 20px;
            left: 10px;
        }

        .tongue {
            height: 90px;
            width: 100px;
            background-color: red;
            position: absolute;
            top: 100px;
            left: 80px;
        }

        .tongue_gap {
            height: 80px;
            width: 10px;
            background-color: black;
            position: absolute;
            top: 0px;
            left: 45px;
        }
    </style>
</head>
<body>
    <div class="face">
        <div class="eye">
            <div class="pupil"></div>
        </div>
        <div class="eye" style="left: 160px;">
            <div class="pupil"></div>
        </div>

        <div class="mouth">
            <div class="teeth_row">
                <div class="teeth"></div>
                <div class="teeth"></div>
                <div class="teeth"></div>
                <div class="teeth"></div>
                <div class="teeth"></div>
                <div class="teeth"></div>
            </div>
            <div class="tongue">
                <div class="tongue_gap"></div>
            </div>
        </div>

    </div>
</body>
</html>
